name: Bug report
description: Isocenter did something its documentation says it should not, or failed to do something it says it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **An export that leaks identifying information is not a public issue.** Report it privately, as the [security policy](https://github.com/kvnlng/Isocenter/security/policy) describes.

        Everything written here is public. Never paste or attach patient data, the session store (`.db`, `_pixels.bin`), a manifest, `isocenter.log`, or the compliance report beyond its two summary tables. None of them is de-identified.
  - type: input
    id: version
    attributes:
      label: Isocenter version
      description: 'The output of `python -c "import isocenter; print(isocenter.__version__)"`'
      placeholder: 1.0.0rc3
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Python and platform
      description: 'The output of `python -c "import platform, sys; print(sys.version); print(platform.platform())"`'
      render: text
    validations:
      required: true
  - type: dropdown
    id: store-location
    attributes:
      label: Where the session store lives
      description: The file you passed to `Session(...)`, and the `_pixels.bin` beside it.
      options:
        - Local disk
        - NFS
        - SMB / CIFS
        - Lustre
        - GPFS / Spectrum Scale
        - Other (say which below)
        - Don't know
    validations:
      required: true
  - type: textarea
    id: what-you-ran
    attributes:
      label: What you ran
      description: The smallest code that shows the problem. Replace any path or name that identifies someone.
      render: python
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: Paste tracebacks in full. Describe the data by its shape (modality, manufacturer and model, transfer syntax, the tag or sequence path, how many files), never by its contents.
    validations:
      required: true
  - type: textarea
    id: summary-tables
    attributes:
      label: The report's summary tables (optional)
      description: If you generated a compliance report, paste the Executive Summary table and the Action Type counts under Processing Audit, and nothing else from it.
      render: markdown
  - type: textarea
    id: packages
    attributes:
      label: Other packages (optional)
      description: The output of `pip freeze`, if a codec, OCR or NLP extra is involved.
      render: text
  - type: checkboxes
    id: no-patient-data
    attributes:
      label: Before you submit
      options:
        - label: Nothing in this issue is patient data or identifies anyone, and I have attached no session store, manifest, log or report rows.
          required: true
