name: Publish

# Trusted Publishing: PyPI authenticates this workflow by OIDC, so there is
# no API token in repository secrets, on a laptop, or in ~/.pypirc. Nothing
# to leak, nothing to rotate. The trade is that PyPI pins the *exact*
# identity allowed to publish -- owner, repository, workflow filename and
# environment -- so renaming this file or its environments breaks publishing
# until the publisher is updated at pypi.org/manage/project/isocenter/settings/publishing/

on:
  # Publishing to real PyPI is deliberately tied to a GitHub Release rather
  # than a tag push: a release is a decision someone makes in the UI, and a
  # mistyped `git push --tags` should not be able to burn a version number
  # forever. PyPI never allows re-uploading a version, even a broken one.
  release:
    types: [published]
  # TestPyPI, and re-runs, on demand.
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  # Never cancel a run mid-upload: a half-uploaded release leaves the
  # version consumed on the index with nothing installable under it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3

      - uses: actions/setup-python@v6
        timeout-minutes: 3
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # Read on every run, not just releases. The comparison below can
      # only happen on a release -- a workflow_dispatch has no tag -- but
      # reading the version is the part that can break, so it must run on
      # the TestPyPI rehearsals too. It did not, and the consequence was
      # that this gate failed the first time it was ever executed, on a
      # real release: it called `python setup.py --version`, and the
      # runner's Python has no setuptools.
      - name: Read the packaged version
        id: packaged
        run: |
          # From the built wheel, which is the artifact that gets
          # uploaded. Anything else -- setup.py, a regex over a source
          # file -- re-derives the number and can agree with itself while
          # disagreeing with what was built.
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          # isocenter-0.8.0-py3-none-any.whl -> 0.8.0
          version=$(basename "${wheels[0]}" | cut -d- -f2)
          if [ -z "$version" ]; then
            echo "::error::could not read a version from ${wheels[0]}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "packaged version: $version"

      - name: Release tag must match the packaged version
        if: github.event_name == 'release'
        run: |
          # Publishing v0.7.1 from a tree that still says 0.7.0 produces a
          # release nobody can install by the name they were given, and the
          # version it *did* claim is then permanently spent. Fail here
          # instead.
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.packaged.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not match packaged version ${version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches packaged version ${version}"

      - name: Metadata must be acceptable to the index
        run: twine check dist/*

      - name: The wheel must carry its own resources
        run: |
          # The defect this step exists for: gantry/resources/*.json once
          # shipped in no distribution at all, and nothing failed -- every
          # loader guards on os.path.exists and degrades to a default, so a
          # pip-installed release audited against an empty PHI policy and
          # reported clean. The whole test suite passed while that was true.
          #
          # `cd /tmp` is the entire point. Run this from the repo root and
          # Python imports the source tree, where the resources are always
          # present, and the check passes on a wheel that ships nothing.
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/verify/bin/python - <<'PY'
          from isocenter.config_manager import ConfigLoader

          tags = ConfigLoader.load_phi_config()
          assert tags, (
              "the built wheel ships no default PHI policy -- resources are "
              "missing from the distribution, and this release would "
              "silently de-identify nothing")
          print(f"default PHI tags present in the wheel: {len(tags)}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment name is half of what PyPI matches against. `release`
    # events always go to real PyPI; a manual run goes wherever it was
    # asked to. Environments are also where you hang a required reviewer,
    # if you ever want publishing to need a second pair of eyes.
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
      url: ${{ github.event_name == 'release' && 'https://pypi.org/p/isocenter' || 'https://test.pypi.org/p/isocenter' }}
    permissions:
      # The OIDC token. Without this the action has no identity to present
      # and the upload is rejected; it also signs PEP 740 attestations,
      # which the action emits by default.
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      # Pinned to the commit behind v1.14.2 rather than a moving tag: this
      # is the one step in the repository that runs with id-token: write,
      # so it is the one step where a silently-updated dependency could
      # publish under our identity.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: ${{ (github.event_name != 'release' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
