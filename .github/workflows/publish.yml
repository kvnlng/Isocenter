name: Publish

# Trusted Publishing: PyPI authenticates this workflow by OIDC, so there is
# no API token in repository secrets, on a laptop, or in ~/.pypirc. Nothing
# to leak, nothing to rotate. The trade is that PyPI pins the *exact*
# identity allowed to publish -- owner, repository, workflow filename and
# environment -- so renaming this file or its environments breaks publishing
# until the publisher is updated at pypi.org/manage/project/isocenter/settings/publishing/

on:
  # Manual only. Publishing is a decision someone makes, run as a command
  # against a release tag (RELEASING.md): nothing uploads as a side effect
  # of an event. Not a tag push -- a mistyped `git push --tags` must not be
  # able to burn a version number, and PyPI never allows re-uploading one,
  # even a broken one. And no longer a published GitHub Release: Zenodo
  # archives those, and creating the Release (which this procedure does
  # *after* the upload) must not upload anything.
  #
  # Dispatch from the tag: `gh workflow run publish.yml --ref vX.Y.Z -f
  # target=pypi`. The build job refuses a run to `pypi` from anything that
  # is not a `v*` tag matching the wheel and `isocenter/_version.py`.
  # TestPyPI rehearsals may run from the release branch before tagging.
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  # Never cancel a run mid-upload: a half-uploaded release leaves the
  # version consumed on the index with nothing installable under it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3

      - uses: actions/setup-python@v6
        timeout-minutes: 3
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # Read on every run, rehearsals included. Reading the version is the
      # part that can break, and when it only ran on releases this gate
      # failed the first time it was ever executed, on a real release: it
      # called `python setup.py --version`, and the runner's Python has no
      # setuptools.
      - name: Read the packaged version
        id: packaged
        run: |
          # From the built wheel, which is the artifact that gets
          # uploaded. Anything else -- setup.py, a regex over a source
          # file -- re-derives the number and can agree with itself while
          # disagreeing with what was built.
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          # isocenter-0.8.0-py3-none-any.whl -> 0.8.0
          version=$(basename "${wheels[0]}" | cut -d- -f2)
          if [ -z "$version" ]; then
            echo "::error::could not read a version from ${wheels[0]}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "packaged version: $version"

      # Unconditional. This step was `if: github.event_name == 'release'`,
      # so a manual run to `pypi` uploaded with no tag or version check at
      # all -- and a manual run is now the only way to publish. Publishing
      # v0.7.1 from a tree that still says 0.7.0 produces a release nobody
      # can install by the name they were given, and the version it *did*
      # claim is then permanently spent. Fail here instead, before the
      # upload job can start.
      #
      # Values arrive through `env:`, never `${{ }}` inside the script:
      # interpolating an input into shell text is the injection shape the
      # Actions hardening guide warns about, and
      # tests/test_packaging_contract.py runs this script as written, which
      # only works if the script is the script that runs.
      - name: The ref must be a release tag matching the version
        env:
          TARGET: ${{ inputs.target }}
          PACKAGED: ${{ steps.packaged.outputs.version }}
        run: |
          # The one place the number is declared. Parsed, not imported:
          # importing isocenter needs pydicom and numpy, which this runner
          # does not install.
          declared=$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' isocenter/_version.py)
          if [ -z "$declared" ]; then
            echo "::error::could not read __version__ from isocenter/_version.py"
            exit 1
          fi
          if [ "$PACKAGED" != "$declared" ]; then
            echo "::error::the wheel says ${PACKAGED} but isocenter/_version.py declares ${declared}"
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag="${GITHUB_REF_NAME#v}"
              if [ "$tag" != "$declared" ]; then
                echo "::error::tag ${GITHUB_REF_NAME} does not match version ${declared}"
                exit 1
              fi
              echo "tag ${GITHUB_REF_NAME} matches the wheel and isocenter/_version.py (${declared})"
              ;;
            *)
              # Only a rehearsal may run from a branch. Anything that is
              # not exactly `pypi` uploads to TestPyPI (see the publish
              # job), so this is the same test the upload URL uses.
              if [ "$TARGET" = "pypi" ]; then
                echo "::error::a run to pypi must be dispatched from a v* release tag, not ${GITHUB_REF}"
                exit 1
              fi
              echo "rehearsal from ${GITHUB_REF}: wheel and isocenter/_version.py agree (${declared})"
              ;;
          esac

      - name: Metadata must be acceptable to the index
        run: twine check dist/*

      - name: The wheel must carry its own resources
        run: |
          # The defect this step exists for: gantry/resources/*.json once
          # shipped in no distribution at all, and nothing failed -- every
          # loader guards on os.path.exists and degrades to a default, so a
          # pip-installed release audited against an empty PHI policy and
          # reported clean. The whole test suite passed while that was true.
          #
          # `cd /tmp` is the entire point. Run this from the repo root and
          # Python imports the source tree, where the resources are always
          # present, and the check passes on a wheel that ships nothing.
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          cd /tmp
          #
          # The file read is redaction_rules.json, through the same helper
          # the runtime uses. It was ConfigLoader.load_phi_config(), which
          # read resources/phi_tags.json until #495 moved the default PHI
          # policy into Python (FLOOR_POLICY); against that, this step
          # would pass on a wheel shipping no resources at all.
          /tmp/verify/bin/python - <<'PY'
          import os

          from isocenter.config_manager import RESOURCES_DIR, require_package_resource

          path = require_package_resource(
              RESOURCES_DIR, "redaction_rules.json",
              "scanned every frame with no machine redaction rules")
          assert os.path.getsize(path) > 0, (
              f"the built wheel ships an empty {path} -- this release would "
              "redact no burned-in text by serial")
          assert "site-packages" in path, (
              f"resolved {path}, which is not the installed wheel -- this "
              "check is reading the source tree")
          print(f"machine redaction rules present in the wheel: {path}")
          #
          # The other shipped resource, through the same helper and with
          # the same consequence _load_ctp_rules names at runtime.
          ctp = require_package_resource(
              RESOURCES_DIR, "ctp_rules.json",
              "matched no CTP de-identification rules")
          assert os.path.getsize(ctp) > 0, (
              f"the built wheel ships an empty {ctp} -- this release would "
              "match no CTP de-identification rules")
          assert "site-packages" in ctp, (
              f"resolved {ctp}, which is not the installed wheel -- this "
              "check is reading the source tree")
          print(f"CTP rules present in the wheel: {ctp}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  # The version matrix lives here rather than on every PR. "Which Pythons
  # does this release support" is a release question, and the four-way PR
  # matrix produced zero divergences in 30 runs that were not step
  # timeouts -- it was answering a release question four times a day.
  #
  # Split in two on purpose, because the two halves have different
  # authority over the upload. `continue-on-error` is not an allowed key
  # on a job that calls a reusable workflow, so the distinction is drawn
  # by what `publish` lists in `needs:` instead.
  #
  # Both test the source tree, exactly as the PR gate does. Testing the
  # built wheel would be stronger and is a separate change.
  test-floor:
    # Blocks the upload. These are the two promises the package actually
    # makes -- the `python_requires` floor and free-threaded support (see
    # the matrix comment in tests.yml) -- and shipping a release that
    # fails one of them is the unbacked promise the classifier comment in
    # setup.py exists to prevent.
    #
    # Failing here is cheap: nothing has been uploaded, so the version
    # number is not spent. Fix and re-tag.
    uses: ./.github/workflows/tests.yml
    with:
      python-versions: '["3.12", "3.14t"]'

  test-supported:
    # Reports, does not block. A red job here turns the whole run red --
    # which is the annotation: the release went out with a known failing
    # version. `publish` does not list this in `needs:`, so it proceeds
    # regardless.
    #
    # Publishing anyway is a decision, not an accident. If one of these
    # stays red, drop its classifier from setup.py in the same release
    # rather than advertising a version the release matrix says is broken.
    uses: ./.github/workflows/tests.yml
    with:
      python-versions: '["3.13", "3.14"]'

  publish:
    needs: [build, test-floor]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment name is half of what PyPI matches against, and it is
    # the dispatched target. The URL expressions below test for exactly
    # `pypi` and send everything else to TestPyPI, so only that one value
    # reaches the real index. Environments are also where you hang a
    # required reviewer, if you ever want publishing to need a second pair
    # of eyes.
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/p/isocenter' || 'https://test.pypi.org/p/isocenter' }}
    permissions:
      # The OIDC token. Kept inline in this file rather than moved into a
      # reusable workflow: PyPI matches the *workflow filename* that holds
      # the publishing step, so this job cannot move. The test jobs above
      # call out to tests.yml freely, because they carry no identity. Without this the action has no identity to present
      # and the upload is rejected; it also signs PEP 740 attestations,
      # which the action emits by default.
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      # Pinned to the commit behind v1.14.2 rather than a moving tag: this
      # is the one step in the repository that runs with id-token: write,
      # so it is the one step where a silently-updated dependency could
      # publish under our identity.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: ${{ inputs.target == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
