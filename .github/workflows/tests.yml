name: Isocenter Tests

on:
  # Post-merge verification only. Without the branch filter this also fires
  # on every push to a PR branch, producing a second, duplicate run whose
  # check contexts share the names `main` requires -- ambiguous for branch
  # protection and twice the CI cost.
  push:
    branches:
      - main
  # Deliberately NOT path-filtered. `main` requires these checks, and a
  # required check that never runs leaves a PR blocked forever "waiting
  # for status" rather than failing. Every PR into main runs the suite,
  # whatever it touches.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.14t"]
        include:
          - python-version: "3.12"
            PYTHON_GIL: "1" 
          - python-version: "3.13"
            PYTHON_GIL: "1" 
          - python-version: "3.14"
            PYTHON_GIL: "1" 
          - python-version: "3.14t"
            PYTHON_GIL: "0" 
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      timeout-minutes: 3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      timeout-minutes: 3
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install Dependencies
      timeout-minutes: 3
      run: |
        python -m pip install --upgrade pip
        # setup.py is the single source of truth for dependencies; there is
        # deliberately no requirements.txt to drift from it.
        pip install -e ".[tests]"

    - name: Run Tests
      timeout-minutes: 5
      run: |
        pytest -v
      env:
        PYTHON_GIL: ${{ matrix.PYTHON_GIL }}

