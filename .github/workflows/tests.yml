name: Isocenter Tests

on:
  # No push or pull_request trigger (#704; RELEASING.md, "Changes land on
  # `main`"). `main` has no required status checks: a change merges on
  # the local runs step 3 prescribes and an adversarial review, and the
  # full suite is the integration test when a release is cut. This
  # workflow runs on a hand dispatch, which is information and gates
  # nothing, and when publish.yml calls it, where `test-floor` blocks the
  # upload. The comments that stood here until #707 argued for a branch
  # filter and against path-filtering a *required* check; both described
  # a gate that no longer exists.
  workflow_dispatch:
  # Called by publish.yml, which runs the full version matrix at release
  # time. The gate below is deliberately narrow; the breadth lives there.
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to run.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # `github.workflow` is the *caller's* name when this runs as a reusable
  # workflow, so publish.yml's two calls both evaluate to
  # `Publish-refs/heads/main` -- one group, and with cancel-in-progress
  # they killed each other. Observed on run 33032212241: `test-floor` was
  # cancelled, `publish` was correctly skipped by its `needs`, and nothing
  # shipped. The dangerous half of that coin flip is the other one --
  # `test-supported` loses, `test-floor` passes, and a release goes out
  # having run half the matrix behind a green check.
  #
  # The version list discriminates the two calls. It is empty on a hand
  # dispatch, where `inputs` does not exist, so a dispatched run keeps its
  # own single group.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.python-versions || 'gate' }}
  # Superseding a stale dispatch on the same ref is worth cancelling for.
  # A release's matrix is not: publish.yml sets cancel-in-progress: false so an
  # upload cannot be interrupted, and a called workflow that cancels
  # anyway would defeat that from one level down.
  cancel-in-progress: ${{ !inputs.python-versions }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Never stop the other versions because one went red. The point of a
      # matrix is the whole table; a truncated one cannot tell you whether
      # a failure is version-specific.
      fail-fast: false
      matrix:
        # Two versions, because "supported" is two independent promises on
        # orthogonal axes and neither backs the other:
        #
        #   3.12  -- the floor `python_requires=">=3.12"` asserts. Broken
        #            by 3.13+ syntax or a stdlib API that did not exist in
        #            3.12. A newer version passing proves nothing here.
        #   3.14t -- the free-threaded build. `run_parallel()` chooses
        #            threads over processes when there is no GIL to escape
        #            (`parallel.py`), and everything heavy funnels through
        #            it, so a GIL-enabled interpreter never executes that
        #            path at all. `python_requires` cannot express this
        #            promise: 3.14t *is* 3.14, `t` is the build, not the
        #            version, and the wheel is py3-none-any so the ABI tag
        #            does not carry it either.
        #
        # 3.13 and 3.14 with the GIL are interpolation between a passing
        # floor and a passing ceiling. They moved to the release matrix in
        # publish.yml after 30 runs of the four-way matrix produced zero
        # divergences that were not step timeouts.
        python-version: ${{ fromJSON(inputs.python-versions || '["3.12", "3.14t"]') }}
        # Four duration-balanced shards per version (#707). Four because
        # the release runs four versions: 16 jobs stays under the plan's
        # 20-job concurrency limit. Membership is a pure function of
        # tests/shard_timings.json (tests/support/shards.py), and
        # tests/test_shards_partition_the_suite.py pins that this list is
        # exactly 1..N for the N the run step divides by -- a shard left
        # off this list is a quarter of the suite nobody runs, and green.
        # A test file added after the timings were recorded weighs the
        # median and still lands in exactly one shard. Regenerate the
        # timings on 3.12 with `--record-shard-timings=<abs path>` when the
        # balance drifts; drift costs wall time, never a test.
        #
        # The concurrency group above needs no shard in it: it is declared
        # at workflow level, so it scopes the run, and matrix jobs inside
        # one run do not compete for it.
        shard: [1, 2, 3, 4]
    # Backstop only, against what no step timeout covers -- it must exceed
    # the SUM of the step allowances below, or some step's own timeout
    # becomes unreachable and a hang there dies as 'cancelled' with no
    # failing step in the log. That was #243: this cap sat at 15 while the
    # Run Tests step said 20, so #102's headroom was inert from the day it
    # landed and #250's three hangs each produced a log naming nothing.
    # test_packaging_contract.py pins the inequality. 45 since the suite
    # became four shards (#707): step sum 38, plus the old 7-minute margin.
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7
      timeout-minutes: 3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      timeout-minutes: 3
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install tesseract
      timeout-minutes: 3
      # pytesseract is a wrapper; the OCR itself is a system binary pip
      # cannot supply. Without it `pixel_analysis.HAS_OCR` is still True
      # (it means only that pytesseract imported), but the OCR probe
      # (`pixel_analysis._ocr_unavailable_reason()`, #422) fails and
      # tests/test_discovery_integration.py skips -- which is how that
      # test went unrun for months while the suite looked healthy (#44).
      # A skip caused by a missing system package is indistinguishable
      # from a test that has nothing to say.
      #
      # `update` is deliberately allowed to fail. It exits non-zero if
      # *any* configured source fails, and the runner image ships
      # third-party repositories we neither use nor control: on
      # 2026-08-27 packages.microsoft.com returned 403 for two of them
      # and killed a release rehearsal, because `update && install` under
      # `bash -e` meant `install` never ran. Tesseract comes from
      # azure.archive.ubuntu.com, which was fine throughout.
      #
      # The install is what must succeed, and the version check is what
      # proves it: pip cannot supply this binary, so an install that
      # half-worked would resurface as #44 -- a silent skip that looks
      # like a passing suite.
      run: |
        sudo apt-get update \
          || echo "::warning::apt-get update had failing sources; continuing"
        sudo apt-get install -y tesseract-ocr
        tesseract --version

    - name: Install Dependencies
      timeout-minutes: 3
      run: |
        python -m pip install --upgrade pip
        # setup.py is the single source of truth for dependencies; there is
        # deliberately no requirements.txt to drift from it.
        # `ocr` is installed here but stays an optional extra for users:
        # the no-OCR paths are covered by patching, not by leaving it
        # uninstalled: the tier-2 degradation by patching HAS_OCR
        # (tests/test_pixel_analysis.py), and the Session methods'
        # refusal by patching HAS_OCR and pytesseract together
        # (tests/test_ocr_unavailable_refuses.py, #422).
        pip install -e ".[tests,ocr]"

    - name: Run Tests
      id: suite
      # Measured on the 2026-09-11 gate runs, eight per version (#475):
      # 748-993 s on 3.12 and 574-899 s on 3.14t. The cap was 20 minutes
      # then and the peak sat at 83% of it with the milestone still
      # adding tests; before that it was 5, and on 2026-08-26 every job
      # finished between 5m30s and 6m06s and `test (3.14)` was killed
      # mid-run, reported as a test failure with no failing test in the
      # log -- only "Terminate orphan process: pytest". 30 puts the
      # measured peak at 55%: real headroom, while still catching a
      # genuine hang rather than letting one burn a runner for six
      # hours. test_packaging_contract.py pins this as a floor.
      #
      # Raise this rather than trimming coverage if it tightens again,
      # and raise the job cap above with it: that must exceed the sum
      # of the steps, and pytest.ini's faulthandler_timeout must stay
      # under half of this.
      #
      # It tightened again in v0.9.8, when the suite grew to about 3,800
      # tests. The last ten gate runs on 2026-09-14 took 1314-1643 s on
      # 3.12 and 1213-1559 s on 3.14t, a peak at 91% of 30 minutes. One
      # 3.12 run, for #614, was killed at 98% of the suite (1813 s, no
      # failing test). 45 puts the measured peak at 61%.
      #
      # It reached the cap again before v0.9.8 was tagged. On PR #690 at
      # 30d9e6b, run 35127628235, `test (3.12)`'s Run Tests was killed at
      # 45 minutes with 98% of the suite run and every listed test
      # passing, and `test (3.14t)` finished at 44m37s wall, 99% of the
      # cap. 75 puts that peak near 60%. The job cap above rises to 95,
      # over the step sum of 3+3+3+3+75+1 = 88, and faulthandler_timeout
      # (300 s) stays under half of this.
      #
      # Lowered to 25 when the suite became four shards per version
      # (#707, 2026-09-21): each step runs a quarter of it. Dispatched run
      # 35636320365 at 83009f1e took 435-751 s on 3.12 and 483-715 s on
      # 3.14t across the shards, peak 751 s, which 25 puts at 50%. The
      # step sum is 3+3+3+3+25+1 = 38 and the job cap drops to 45, the
      # same 7-minute margin as before; faulthandler_timeout (300 s)
      # stays under half of this. The shards are uneven on a runner
      # (shard 1 lightest) because the timings were recorded locally; that
      # costs wall time, not coverage.
      timeout-minutes: 25
      run: |
        pytest -v --shard=${{ matrix.shard }}/4
      env:
        # Derived from the version rather than carried in a parallel
        # `include:` block, so adding a version to the matrix cannot
        # silently run a free-threaded build with the GIL back on -- which
        # would pass while testing none of what it was added for.
        PYTHON_GIL: ${{ endsWith(matrix.python-version, 't') && '0' || '1' }}
        # Child-side stall diagnostics: each pool worker arms
        # faulthandler.dump_traceback_later(240, exit=False) at start.
        # pytest's faulthandler_timeout can only dump the parent's
        # threads -- #250's occurrence-four dump showed all of them
        # idle, because the stalled lock holder was a child it cannot
        # see into. CI-only on purpose: production users never pay for
        # instrumentation (test_packaging_contract.py pins both this
        # line and the 240 < 300 inequality).
        ISOCENTER_WORKER_FAULTHANDLER: "1"

    - name: Record the result for the release matrix
      # `if: always()` so a red version still reports. This is what makes
      # the publish run's summary a compatibility table rather than a list
      # of whatever happened to pass.
      if: always()
      timeout-minutes: 1
      run: |
        outcome="${{ steps.suite.outcome }}"
        [ "$outcome" = "success" ] && mark="pass" || mark="**$outcome**"
        echo "- Python ${{ matrix.python-version }} (GIL=${{ endsWith(matrix.python-version, 't') && '0' || '1' }}) shard ${{ matrix.shard }}/4: $mark" \
          >> "$GITHUB_STEP_SUMMARY"

