name: Documentation

on:
  # The site is versioned (#866): one folder per minor line (`1.0/`,
  # `1.1/`), a `latest` alias copied from the highest final release, and
  # a hidden `dev/` for `main`. The root redirects to `latest/`, so the
  # default site describes the latest release, never unreleased `main`.
  # It is built with Sphinx and put onto `gh-pages` by
  # `.github/scripts/docs_deploy.sh`, which keeps the layout and the
  # `versions.json` mike made. The ref filter is load-bearing, not
  # tidiness: this workflow pushes straight to the live site, and a
  # filter that admitted branches is how unreviewed documentation went
  # live twice during the isocenter rename, from a feature branch.
  #
  # No `paths` filter. A folder is the release's whole tree -- the API
  # reference is generated from docstrings in `isocenter/` -- and a
  # release whose `docs/` did not change since the last tag still has to
  # replace its line's folder.
  #
  # The trigger is necessary, not sufficient: the `guard` job decides
  # which folder the ref may write, or refuses it (RELEASING.md,
  # "Documentation site", has the table).
  push:
    tags:
      - 'v*'
  # `main` reaches `dev/` by dispatch only (#866, Q2), and a docs-only
  # change reaches a released line by dispatch from `release/X.Y`.
  #
  # A dispatch runs the workflow file *at that ref*, so a tag deploys with
  # the tooling it was cut with, whatever this file says now:
  #
  # NEVER dispatch this workflow from a tag cut before #866 (v1.0.0rc6
  # and every tag before it). That is the old `mkdocs gh-deploy`: while
  # that tag is still the highest, its old guard admits it, and gh-deploy
  # commits a tree holding only its root site, deleting every version
  # folder, `versions.json` and the old-URL stubs.
  #
  # NEVER dispatch it from a tag cut before the move to Sphinx
  # (v1.0.0rc21 and every tag before it). That runs MkDocs and mike, and
  # puts a Material build back into its folder (and `latest/`) without
  # updating `switcher.json`. Its own old guard refuses it once a later
  # tag exists on its line.
  workflow_dispatch:

permissions:
  contents: read

# No workflow-level concurrency group, on purpose; see the deploy job's.

jobs:
  # Its own job, outside the deploy's concurrency group. When the group
  # sat at workflow level, a run this guard was about to refuse -- a patch
  # tag on an older line, a dispatch from a branch, the second of two tags
  # pushed together -- joined the group first, cancelled a deploy in
  # progress, and then refused itself.
  guard:
    runs-on: ubuntu-latest
    # Above the sum of its step caps (3 + 1 = 4), for the same reason the
    # deploy job's cap is; see there.
    timeout-minutes: 6
    outputs:
      folder: ${{ steps.decide.outputs.folder }}
      title: ${{ steps.decide.outputs.title }}
      alias: ${{ steps.decide.outputs.alias }}
      hidden: ${{ steps.decide.outputs.hidden }}
    steps:
    # `fetch-depth: 0` fetches every tag and the history the release-branch
    # rule diffs. A shallow checkout has neither.
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
      timeout-minutes: 3

    # The rule lives in one file because the deploy job runs it again
    # just before the deploy (see there). The file says what the rule
    # is and why; RELEASING.md, "Documentation site", has it as a table.
    # tests/test_packaging_contract.py runs it against real tags.
    - name: Decide which docs folder this ref may write
      id: decide
      timeout-minutes: 1
      run: bash .github/scripts/docs_decide.sh

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Deploys queue; none cancels another (#866). Newest-wins was right
    # while every deploy wrote the one root site. Now runs write different
    # folders, and cancelling a `1.0/` deploy because a `dev/` one started
    # would drop 1.0's update silently. GitHub keeps at most one run
    # pending per group, so a third arrival cancels the pending one: that
    # shows as a cancelled run, and is re-dispatched from its ref.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    # The inequality `tests.yml` also carries, and the
    # direction is the load-bearing half: this cap must EXCEED the sum of
    # every step cap below (3 + 3 + 1 + 3 + 5 + 8 + 1 + 1 + 5 = 30), so
    # whatever hangs, the timeout that fires belongs to a step and the log
    # names it. It was the other way round until #635 -- a job cap of 10
    # over step caps totalling 11, with three steps uncapped entirely -- so
    # a slow pip step was killed by the job cap, which says only "the docs
    # job hung". Raise this before raising any step cap, never after.
    # `tests/test_packaging_contract.py::test_the_docs_deploy_builds_strict_from_the_docs_extra`
    # holds both halves.
    timeout-minutes: 32
    # Outside the checkout, so nothing the build writes can be mistaken
    # for a tracked file. The build and the deploy read the one value.
    env:
      SITE: ${{ runner.temp }}/site

    steps:
    # `fetch-depth: 0` also fetches `origin/gh-pages`, which the deploy
    # builds its commit on.
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
      timeout-minutes: 3

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      timeout-minutes: 3
      with:
        python-version: "3.14"

    - name: Set cache id
      run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      timeout-minutes: 1

    - name: Cache the docs extra's downloads
      uses: actions/cache@v6
      timeout-minutes: 3
      with:
        key: docs-sphinx-${{ env.cache_id }}
        path: ~/.cache
        restore-keys: |
          docs-sphinx-
    # From the `docs` extra, not a hand-copied list. The workflow named
    # five distributions of its own -- including `pymdown-extensions`,
    # which setup.py did not, and omitting `mkdocs`, which it did. Both
    # lists resolved to the identical eleven packages at the identical
    # versions when measured for #635, which is what a second source of
    # truth looks like right up to the edit that moves one of them.
    - run: pip install -e ".[docs]"
      timeout-minutes: 5
    # The tree this builds is the tree the deploy step pushes; nothing
    # builds it again. `-W` makes every Sphinx warning (a broken
    # cross-reference, a docstring napoleon cannot read, a missing page)
    # fail the run before anything is pushed, and `--keep-going` lists all
    # of them in one run rather than the first. `-d` keeps the pickled
    # build state out of SITE, which would otherwise be published into
    # every folder. DOCS_FOLDER is the guard's folder: docs/conf.py gives
    # it to the version switcher as this build's version, which is what
    # puts the "not the latest release" banner on every folder but the
    # one `latest` copies.
    #
    # Do not "clean up" `-W` after a red deploy. The warning count is zero,
    # so a red here is new drift, and the fix is the docstring or the
    # link, not the flag.
    - name: Build the site
      timeout-minutes: 8
      env:
        DOCS_FOLDER: ${{ needs.guard.outputs.folder }}
      run: sphinx-build -W --keep-going -b dirhtml -d "$RUNNER_TEMP/doctrees" docs "$SITE"
    # Every heading id the MkDocs site published is kept by the slug hook
    # in docs/_ext/slugs.py, which myst-parser reaches through
    # `myst_heading_slug_func`. Sphinx makes ids of its own as well, so a
    # myst-parser release that stopped calling the hook would build
    # cleanly and break every deep link into the site. This one id exists
    # only through the hook (Sphinx's own is `frozen-at-1-0`).
    # tests/test_packaging_contract.py checks the heading is still there.
    - name: Check the published heading ids survived
      timeout-minutes: 1
      run: |
        if ! grep -q 'id="frozen-at-10"' "$SITE/api/stability/index.html"; then
          echo "::error::api/stability/ has no id=\"frozen-at-10\"; the heading-id hook (docs/_ext/slugs.py) did not run, so every deep link the MkDocs site published is broken"
          exit 1
        fi
    # The guard decided minutes ago, and possibly much longer: "Re-run
    # failed jobs" reuses an old run's guard outputs, and two tag pushes'
    # deploys enter the queue in the order their guards *finished*. Either
    # can carry `alias=latest` decided before a newer final existed, and
    # move `latest` back onto an older line, or put a superseded patch back
    # into its folder. So the same rule runs again here, against the tags
    # as they are now, and any difference fails the run before anything
    # moves. The remedy is always a fresh dispatch from the ref, which
    # decides again (RELEASING.md, "Documentation site").
    - name: Check the guard's decision still holds
      timeout-minutes: 1
      env:
        FOLDER: ${{ needs.guard.outputs.folder }}
        TITLE: ${{ needs.guard.outputs.title }}
        ALIAS: ${{ needs.guard.outputs.alias }}
        HIDDEN: ${{ needs.guard.outputs.hidden }}
      run: |
        git fetch --quiet --force --tags origin
        now=$(mktemp)
        if ! GITHUB_OUTPUT="$now" bash .github/scripts/docs_decide.sh; then
          echo "::error::${GITHUB_REF} may no longer deploy (above); the guard admitted it before the tags changed. Do not re-run this run: dispatch docs.yml again from its ref"
          exit 1
        fi
        decided=$(printf 'folder=%s\ntitle=%s\nalias=%s\nhidden=%s' "$FOLDER" "$TITLE" "$ALIAS" "$HIDDEN")
        current=$(cat "$now")
        if [ "$current" != "$decided" ]; then
          echo "the guard decided:"
          printf '%s\n' "$decided" | sed 's/^/  /'
          echo "the tags now decide:"
          printf '%s\n' "$current" | sed 's/^/  /'
          echo "::error::the guard's decision for ${GITHUB_REF} is stale; deploying it would undo a newer deploy. Do not re-run this run: dispatch docs.yml again from its ref"
          exit 1
        fi
        echo "the decision still holds: ${FOLDER}/ titled ${TITLE}${ALIAS:+, moving ${ALIAS}}"
    # The guard's decision arrives through `env:`, never interpolated into
    # the script. The script says what it writes and what it never
    # touches. Its push is plain, without force: a `gh-pages` that moved
    # since its fetch fails this run rather than being pushed over.
    - name: Deploy onto gh-pages
      timeout-minutes: 5
      env:
        FOLDER: ${{ needs.guard.outputs.folder }}
        TITLE: ${{ needs.guard.outputs.title }}
        ALIAS: ${{ needs.guard.outputs.alias }}
        HIDDEN: ${{ needs.guard.outputs.hidden }}
      run: bash .github/scripts/docs_deploy.sh
