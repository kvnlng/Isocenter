name: Documentation

on:
  # The branch filter is load-bearing, not tidiness: this job runs
  # `mkdocs gh-deploy`, which publishes straight to the live site. Without
  # it, any push to any branch touching docs/** deploys unreviewed
  # documentation -- which is exactly what happened twice during the
  # isocenter rename, from a feature branch, before the PR was merged.
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
      timeout-minutes: 3

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      timeout-minutes: 3
      with:
        python-version: "3.14"

    - name: Set cache id
      run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

    - name: Install and Deploy MkDocs Material
      uses: actions/cache@v6
      with:
        key: mkdocs-material-${{ env.cache_id }}
        path: ~/.cache 
        restore-keys: |
          mkdocs-material-
    - run: pip install mkdocs-material mkdocs-awesome-pages-plugin mkdocstrings pymdown-extensions mkdocstrings-python
      timeout-minutes: 5
    - run: mkdocs gh-deploy