name: Documentation

on:
  # The documentation follows the latest *published release*, not `main`:
  # `main` is the development branch (RELEASING.md), and a site built from
  # it describes behaviour nobody can `pip install`. So the site deploys
  # from release tags. The ref filter is load-bearing, not tidiness: this
  # job runs `mkdocs gh-deploy`, which publishes straight to the live
  # site, and a filter that admitted branches is how unreviewed
  # documentation went live twice during the isocenter rename, from a
  # feature branch.
  #
  # No `paths` filter. The site is the release's whole tree -- the API
  # reference is generated from docstrings in `isocenter/` -- and a release
  # whose `docs/` did not change since the last tag still has to replace
  # the previous release's site.
  #
  # The trigger is necessary, not sufficient: the `guard` job refuses any
  # ref but the *latest* `v*` tag, so a patch tagged on an older release
  # line cannot replace a newer release's documentation, and a manual run
  # from a branch deploys nothing.
  push:
    tags:
      - 'v*'
  # To redeploy the current release (say, after a failed run), dispatch
  # from its tag: `gh workflow run docs.yml --ref vX.Y.Z`.
  workflow_dispatch:

permissions:
  contents: read

# No workflow-level concurrency group, on purpose; see the deploy job's.

jobs:
  # Its own job, outside the deploy's concurrency group. When the group
  # sat at workflow level, a run this guard was about to refuse -- a patch
  # tag on an older line, a dispatch from a branch, the second of two tags
  # pushed together -- joined the group first, cancelled the latest
  # release's deploy in progress, and then refused itself, leaving the
  # site on whatever was live before that release.
  guard:
    runs-on: ubuntu-latest
    # Above the sum of its step caps (3 + 1 = 4), for the same reason the
    # deploy job's cap is; see there.
    timeout-minutes: 6
    steps:
    # `fetch-depth: 0` fetches every tag, which the guard compares
    # against. A shallow checkout has no tags to compare with.
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
      timeout-minutes: 3

    # The highest `v*` tag by *version* order, not creation order or text
    # order: under the release-branch procedure `v0.9.9` can be tagged on
    # `release/0.9` after `v0.10.0` shipped, and as text it sorts after
    # `v0.10.0` too. The `versionsort.suffix` settings sort `a`, `b` and
    # `rc` as pre-releases: without them git ranks `v1.0.0rc1` above
    # `v1.0.0`, and the release would be refused for as long as its
    # candidate's tag existed. A pre-release of a *later* version still
    # outranks the current release (`v1.0.1rc1` > `v1.0.0`), and blocks its
    # deploy; RELEASING.md says so.
    # tests/test_packaging_contract.py runs this script against real tags.
    - name: Deploy only the latest release tag
      timeout-minutes: 1
      run: |
        case "$GITHUB_REF" in
          refs/tags/v*) ;;
          *)
            echo "::error::the documentation deploys from the latest v* release tag only, not ${GITHUB_REF}"
            exit 1
            ;;
        esac
        latest=$(git -c versionsort.suffix=a -c versionsort.suffix=b -c versionsort.suffix=rc \
          tag --list 'v*' --sort=-version:refname | head -n 1)
        if [ "$GITHUB_REF_NAME" != "$latest" ]; then
          echo "::error::${GITHUB_REF_NAME} is not the latest release tag (${latest}); deploying it would replace newer documentation"
          exit 1
        fi
        echo "deploying the documentation for ${GITHUB_REF_NAME}, the latest release tag"

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Newest deploy wins, and only runs that passed the guard get here, so
    # "newest" is always a deploy of the latest release tag.
    concurrency:
      group: docs-deploy
      cancel-in-progress: true
    # The inequality `tests.yml` and `hang-probe.yml` both carry, and the
    # direction is the load-bearing half: this cap must EXCEED the sum of
    # every step cap below (3 + 3 + 1 + 3 + 5 + 4 = 19), so whatever
    # hangs, the timeout that fires belongs to a step and the log names
    # it. It was the other way round until #635 -- a job cap of 10 over
    # step caps totalling 11, with three steps uncapped entirely -- so a
    # slow pip step was killed by the job cap, which says only "the docs
    # job hung". Raise this before raising any step cap, never after.
    # `tests/test_packaging_contract.py::test_the_docs_deploy_builds_strict_from_the_docs_extra`
    # holds both halves.
    timeout-minutes: 22

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
      timeout-minutes: 3

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      timeout-minutes: 3
      with:
        python-version: "3.14"

    - name: Set cache id
      run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      timeout-minutes: 1

    - name: Install and Deploy MkDocs Material
      uses: actions/cache@v6
      timeout-minutes: 3
      with:
        key: mkdocs-material-${{ env.cache_id }}
        path: ~/.cache 
        restore-keys: |
          mkdocs-material-
    # From the `docs` extra, not a hand-copied list. The workflow named
    # five distributions of its own -- including `pymdown-extensions`,
    # which setup.py does not, and omitting `mkdocs`, which it does. Both
    # lists resolved to the identical eleven packages at the identical
    # versions when measured for #635, which is what a second source of
    # truth looks like right up to the edit that moves one of them.
    # Measured at 10.4 s warm on 3.14.7, against this 5-minute cap.
    - run: pip install -e ".[docs]"
      timeout-minutes: 5
    # `--strict` turns a mkdocs or griffe warning into a failed deploy.
    # This is safe on a workflow that publishes to the live site, and the
    # reason is the ordering inside mkdocs: `gh_deploy_command` runs
    # `build.build(cfg)` in a `try/finally` and reaches
    # `gh_deploy.gh_deploy(...)` only afterwards, and `--strict` makes
    # `build.build` raise `Abort`. So a warning costs a red deploy run
    # and a site still serving its previous build -- it cannot publish a
    # broken one.
    #
    # What it newly catches is ONE class: a broken relative file link
    # under `docs/`. Measured by mutation for #635, that is red under
    # `--strict` and green on all 38 documentation tests the suite
    # runs. The griffe class of warning (an `Args:` entry naming a
    # parameter the def does not have) is already red pre-merge on
    # `tests/test_api_docstrings_render_cleanly.py`, and that test is NOT
    # made redundant by this flag: a second line at the base indent under
    # a `Returns:` renders as several untyped values, draws no mkdocs
    # warning at all, and is caught only there. Neither guard subsumes
    # the other.
    #
    # Do not "clean up" this flag after a red deploy. The warning count
    # at 0.9.8 was zero, so a red here is new drift, and the fix is the
    # docstring or the link -- not the flag.
    - run: mkdocs gh-deploy --strict
      timeout-minutes: 4