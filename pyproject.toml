# Build backend only. Every piece of distribution metadata --
# dependencies, version, classifiers -- deliberately stays in setup.py:
# a [project] table here would override it, and tests/
# test_packaging_contract.py parses setup.py to prove the declared
# dependencies match what the code imports. Two lists drift; this
# project has already been bitten by that once (python-dotenv).
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
