# Configuration B of the output fingerprint (#717; scripts/output_fingerprint.py).
# Configuration A without the machine rule and with private tags kept, so
# private elements reach the output -- and their VRs are visible in the
# explicit-VR arm, B.dicom-j2k. Editing this file changes what is measured:
# retake fingerprint/output.json in the same change.
version: '2.0'
privacy_profile: basic
phi_tags:
  0008,0020:
    action: JITTER
    name: Study Date
  0010,0040:
    action: KEEP
    name: Patient's Sex
  0010,1010:
    action: KEEP
    name: Patient's Age
date_jitter:
  min_days: -365
  max_days: -1
remove_private_tags: false
