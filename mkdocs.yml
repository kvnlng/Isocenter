site_name: Isocenter
site_description: De-identify a DICOM cohort without touching the source files, and hand compliance a report that names anything the run could not do.
site_url: https://kvnlng.github.io/Isocenter/
repo_url: https://github.com/kvnlng/Isocenter
repo_name: kvnlng/Isocenter
edit_uri: edit/main/docs/

theme:
  name: material
  # The "clinical ledger" system (#350): Material's text and code fonts
  # come from here; Newsreader for headings and every colour come from
  # docs/stylesheets/extra.css, which remaps Material's CSS variables.
  # One light scheme only -- the design has no dark variant yet, and a
  # dark toggle that switched to Material's stock slate would break the
  # system rather than extend it.
  custom_dir: docs/overrides
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    scheme: default
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/solid/paper-plane
      link: mailto:support@isocenter.net

copyright: Copyright &copy; 2026 Kevin Long

plugins:
  - search
  - awesome-pages
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: true
            show_source: true
            docstring_options:
              # `Returns:` and `Yields:` items here are the canonical
              # Google form, `Type: description`. Griffe's default reads
              # the word before the colon as a *name* and takes the type
              # from the def's return annotation, so every unannotated
              # method rendered "returned value 'int'" with no type and
              # `mkdocs build --strict` failed on 30 such warnings (#565).
              # This is the reading the docstrings were written for, and
              # `tests/test_api_docstrings_render_cleanly.py` pins the
              # shape it needs: one item per block, typed before the colon.
              returns_named_value: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - attr_list
  - md_in_html

docs_dir: docs

# Internal design specs live under docs/ by convention but are not site content.
exclude_docs: |
  superpowers/
  overrides/

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Features:
      - 'Performance': performance.md
      - 'Architecture': architecture.md
      - 'Intelligent OCR': ocr.md
  - Guides:
      - 'Installation': installation.md
      - 'Quick Start': quickstart.md
      - 'Configuration': configuration.md
      - 'Environment Variables': environment.md
      - 'Migration Tools': migration.md
      - 'Analytics & Reporting': analytics.md
      - 'Waveforms & WFDB': waveforms.md
  - Tutorials:
      - 'De-identify and read the grade': tutorials/deidentify-and-read-the-grade.md
      - 'Select part of a cohort': tutorials/select-part-of-a-cohort.md
      - 'Keep a way back to the identities': tutorials/reversible-anonymization.md
      - 'Black out a region of every image': tutorials/redact-burned-in-pixels.md
  - API Reference:
      - 'API stability': api/stability.md
      - 'Session': api/session.md
      - 'Configuration': api/configuration.md
      - 'Entities': api/entities.md
      - 'Persistence': api/persistence.md
      - 'Exporter registry': api/exporters.md
      - 'Intelligent OCR': api/ocr.md
  - Project Info:
      - 'For institutions': for-institutions.md
      # Points at the real file rather than a copy inside docs/. The
      # copy drifted 97 lines behind and stopped at 0.6.0 (#52); a
      # changelog with two homes only ever has one that is current.
      - 'Changelog': https://github.com/kvnlng/Isocenter/blob/main/CHANGELOG.md
      - 'Roadmap': roadmap.md
