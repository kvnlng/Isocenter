[pytest]
# Bare `pytest` collects only the real suite. Without this, the sdist
# staging directory the packaging-contract test leaves in the repo root
# (`isocenter-<version>/`, carrying a full copy of tests/ via
# MANIFEST.in's `graft tests`) gets collected as a second copy of every
# module, and collection dies on `import file mismatch` -- presenting as
# a mysterious flake at whatever position the duplicate lands. CI never
# sees it (clean checkouts); it only burns contributors (#245). Naming
# `tests` also closes the class: any future artifact directory holding
# test copies stays uncollectable. `pytest path/to/test.py` is
# unaffected -- testpaths applies only when no path is given.
testpaths = tests
# Diagnostic only, never fatal: a test still running after this many
# seconds gets every thread's traceback dumped to stderr and keeps
# going. Each of #250's three CI hangs left ~12 minutes of silence
# before the step timeout killed the run with a log whose last line was
# the previous test passing; this turns the next one into a stack trace
# of where it stuck. The slowest legitimate test finishes in well under
# a minute, so 300s cannot fire on a healthy run, and it sits far
# enough inside the Run Tests step's 20-minute cap that the dump lands
# while the process is still alive (test_packaging_contract.py pins
# that inequality).
faulthandler_timeout = 300
filterwarnings =
    ignore:::pydicom.*
